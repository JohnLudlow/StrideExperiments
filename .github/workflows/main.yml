# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on: [push]

env:
  Configuration: Release

jobs:

  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build 4xGame
      run: dotnet build --no-restore --configuration ${{ env.Configuration }}

    - name: Test 4xGame
      run: dotnet test --no-build --configuration ${{ env.Configuration }}

    - name: Benchmark OcclusionTest
      if: env.Configuration == 'Release'
      run: dotnet run --project ./OcclusionTest/StrideExperiments.OcclusionTest.Benchmarks/StrideExperiments.OcclusionTest.Benchmarks.csproj --configuration ${{ env.Configuration }} --no-build
